name: Release

# The Play bundle signed with the upload key, kept as an artifact of the run for
# an upload to the Play Console, and an F-Droid APK for each ABI signed with the
# release key. On a tag the APKs go to a GitHub release of that tag, published
# with notes made from the commits. A run by hand checks the signing without a tag.
on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.31.6
  # SHA-256 of the upload certificate made by scripts/make-upload-key.sh.
  UPLOAD_CERTIFICATE_SHA256: d6dc475e749b6450d876f852cd96aad0152a2aae156fc2ed3169f8efa6b17bb6
  # SHA-256 of the release certificate made by scripts/make-release-key.sh.
  RELEASE_CERTIFICATE_SHA256: 93c9e14fdaf0375a7d4f0631bee6cbba8c413f297545385f0badb3250e7b9281

jobs:
  play:
    name: Signed Play bundle and APKs
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/.deps
          key: engine-deps-${{ hashFiles('engine/src/main/cpp/cmake/deps.cmake') }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: The tag names the version of the app
        if: github.event_name == 'push'
        run: |
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          if [[ "$version" != "${GITHUB_REF_NAME#v}" ]]; then
            echo "The tag $GITHUB_REF_NAME does not match versionName $version" >&2
            exit 1
          fi
      - name: Restore the upload key
        env:
          UPLOAD_KEYSTORE_B64: ${{ secrets.PERIGEE_UPLOAD_KEYSTORE_B64 }}
        run: |
          if [[ -z "$UPLOAD_KEYSTORE_B64" ]]; then
            echo 'The secret PERIGEE_UPLOAD_KEYSTORE_B64 is missing' >&2
            exit 1
          fi
          printf '%s' "$UPLOAD_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          chmod 600 "$RUNNER_TEMP/upload.jks"
      - name: Build the bundle
        env:
          PERIGEE_UPLOAD_KEYSTORE: ${{ runner.temp }}/upload.jks
          PERIGEE_UPLOAD_PASSWORD: ${{ secrets.PERIGEE_UPLOAD_PASSWORD }}
        run: |
          if [[ -z "$PERIGEE_UPLOAD_PASSWORD" ]]; then
            echo 'The secret PERIGEE_UPLOAD_PASSWORD is missing' >&2
            exit 1
          fi
          ./gradlew :app:bundlePlayRelease
      - name: The bundle is signed with the upload key
        run: |
          bundle=app/build/outputs/bundle/playRelease/app-play-release.aab
          jarsigner -verify "$bundle" > /dev/null
          digest="$(keytool -printcert -jarfile "$bundle" | sed -n 's/^[[:space:]]*SHA256: //p' | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          if [[ "$digest" != "$UPLOAD_CERTIFICATE_SHA256" ]]; then
            echo "The bundle is signed with $digest, not with the upload key" >&2
            exit 1
          fi
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perigee-play-${{ github.ref_name }}
          path: app/build/outputs/bundle/playRelease/app-play-release.aab
          if-no-files-found: error
          retention-days: 90
      - name: Restore the release key
        env:
          RELEASE_KEYSTORE_B64: ${{ secrets.PERIGEE_RELEASE_KEYSTORE_B64 }}
        run: |
          if [[ -z "$RELEASE_KEYSTORE_B64" ]]; then
            echo 'The secret PERIGEE_RELEASE_KEYSTORE_B64 is missing' >&2
            exit 1
          fi
          printf '%s' "$RELEASE_KEYSTORE_B64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          chmod 600 "$RUNNER_TEMP/release.jks"
      # One APK for each ABI: the engine for all three makes a package too big
      # for a phone that runs one of them.
      - name: Build the APKs
        env:
          PERIGEE_RELEASE_KEYSTORE: ${{ runner.temp }}/release.jks
          PERIGEE_RELEASE_PASSWORD: ${{ secrets.PERIGEE_RELEASE_PASSWORD }}
        run: |
          if [[ -z "$PERIGEE_RELEASE_PASSWORD" ]]; then
            echo 'The secret PERIGEE_RELEASE_PASSWORD is missing' >&2
            exit 1
          fi
          version="$(sed -n 's/^ *versionName = "\(.*\)"$/\1/p' app/build.gradle.kts)"
          mkdir -p "$RUNNER_TEMP/apks"
          for abi in arm64-v8a armeabi-v7a x86_64; do
            ./gradlew -PperigeeAbis="$abi" :app:assembleFdroidRelease
            cp app/build/outputs/apk/fdroid/release/app-fdroid-release.apk "$RUNNER_TEMP/apks/perigee-$version-$abi.apk"
          done
      - name: The APKs are signed with the release key
        run: |
          apksigner="$(printf '%s\n' "$ANDROID_HOME"/build-tools/* | sort -V | tail -n 1)/apksigner"
          for apk in "$RUNNER_TEMP"/apks/*.apk; do
            digest="$("$apksigner" verify --print-certs "$apk" | sed -n 's/^.*certificate SHA-256 digest: //p' | sort -u)"
            if [[ "$digest" != "$RELEASE_CERTIFICATE_SHA256" ]]; then
              echo "$apk is signed with '$digest', not with the release key" >&2
              exit 1
            fi
          done
          (cd "$RUNNER_TEMP/apks" && sha256sum -- *.apk > SHA256SUMS)
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: perigee-apks-${{ github.ref_name }}
          path: ${{ runner.temp }}/apks
          if-no-files-found: error
          retention-days: 90
      - name: Publish the GitHub release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          if [[ "$GITHUB_REF_NAME" == *-* ]]; then prerelease=(--prerelease); fi
          gh release create "$GITHUB_REF_NAME" --verify-tag "${prerelease[@]}" \
            --title "Perigee ${GITHUB_REF_NAME#v}" --generate-notes \
            "$RUNNER_TEMP"/apks/*.apk "$RUNNER_TEMP/apks/SHA256SUMS"
