name: Reader accessibility menu probe
on:
  push:
    branches: [hermes/156-talkback]

permissions:
  contents: read

env:
  NDK_VERSION: 28.2.13676358
  CMAKE_VERSION: 3.31.6
  ORG_GRADLE_PROJECT_perigeeAbis: x86_64

jobs:
  menu:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
      - uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version: 21
      - name: Install the NDK and CMake
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION" "cmake;$CMAKE_VERSION" "platforms;android-36"
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: engine/.deps
          key: engine-deps-${{ hashFiles('engine/src/main/cpp/cmake/deps.cmake') }}
      - uses: gradle/actions/setup-gradle@3f5f9adaf7d9fecd50b5935e54106014257a94e6 # v6.4.0
      - name: Let the emulator use KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # Built once and installed by the script: each round runs the test itself, not Gradle.
      - name: Build the app and its tests
        run: |
          ./gradlew :app:assembleFdroidDebug :app:assembleFdroidDebugAndroidTest
          mkdir apks
          cp app/build/outputs/apk/fdroid/debug/app-fdroid-debug.apk apks/app.apk
          cp app/build/outputs/apk/androidTest/fdroid/debug/app-fdroid-debug-androidTest.apk apks/tests.apk
      - name: Install the system image
        run: |
          image=system-images/android-36/google_apis/x86_64
          for attempt in 1 2 3; do
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --install "system-images;android-36;google_apis;x86_64" --channel=0 > /dev/null || true
            if [ -f "$ANDROID_HOME/$image/system.img" ]; then exit 0; fi
            echo "Attempt $attempt: the system image did not install"
            rm -rf "$ANDROID_HOME/.temp" "$ANDROID_HOME/.downloadIntermediates" "$ANDROID_HOME/$image"
            sleep 15
          done
          exit 1
      - uses: ReactiveCircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d # v2.38.0
        with:
          api-level: 36
          target: google_apis
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader -no-snapshot -noaudio -no-boot-anim
          script: python3 .github/scripts/menu_accessibility_probe.py
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: always()
        with:
          name: menu-accessibility-rounds
          path: menu-rounds
          if-no-files-found: error
